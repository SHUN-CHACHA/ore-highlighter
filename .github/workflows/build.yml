name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "OreHighlighter" main.py

      - name: Generate SHA256 checksum
        run: |
          cd dist
          certutil -hashfile OreHighlighter.exe SHA256 > OreHighlighter.exe.sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OreHighlighter-windows
          path: |
            dist/OreHighlighter.exe
            dist/OreHighlighter.exe.sha256.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OreHighlighter.exe
            dist/OreHighlighter.exe.sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
